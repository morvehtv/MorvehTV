name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk MorvehTV.apk
          echo "VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: MorvehTV-apk
          path: MorvehTV.apk
      # Publica (o actualiza) la release con el número de versión de la app (versionName).
      - name: Publicar release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: MorvehTV ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: MorvehTV.apk
