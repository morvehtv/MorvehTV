name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk MorvehTV.apk
          echo "VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_ENV"
      - name: Verificar APK
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          echo "::notice title=badging::$($BT/aapt2 dump badging MorvehTV.apk | grep -E '^(package|sdkVersion|targetSdkVersion|native-code|uses-feature|application-label)' | tr '\n' ' ')"
          echo "::notice title=firma::$($BT/apksigner verify -v --min-sdk-version 19 MorvehTV.apk 2>&1 | tr '\n' ' ')"
          echo "::notice title=zip::$(unzip -l MorvehTV.apk | tail -n +4 | awk '{print $4}' | tr '\n' ' ' | cut -c1-900)"
      - uses: actions/upload-artifact@v4
        with:
          name: MorvehTV-apk
          path: MorvehTV.apk
      # Publica (o actualiza) la release con el número de versión de la app (versionName).
      # Reintenta varias veces por si el servicio de subida de GitHub falla un momento.
      - name: Publicar release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION"
          for i in 1 2 3 4 5 6; do
            # borra un borrador vacío que haya quedado de un intento fallido
            if gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null | grep -q true; then
              gh release delete "$TAG" --yes || true
            fi
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" MorvehTV.apk --clobber && exit 0
            else
              gh release create "$TAG" MorvehTV.apk --title "MorvehTV $VERSION" --target "$GITHUB_SHA" --latest \
                --notes "APK listo para instalar en Android TV, Google TV y Fire TV." && exit 0
            fi
            echo "Intento $i fallido; reintentando en $((i * 20)) s…"
            sleep $((i * 20))
          done
          exit 1
