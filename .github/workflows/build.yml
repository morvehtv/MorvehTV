name: Compilar APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk MorvehTV.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MorvehTV-apk
          path: MorvehTV.apk
      # Al subir una etiqueta (v1.2, v1.3…) se publica la release con el APK adjunto.
      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: MorvehTV ${{ github.ref_name }}
          files: MorvehTV.apk
